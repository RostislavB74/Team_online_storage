[tool.poetry]
name = "teamchallenge-1444"
version = "0.2.0"
description = "teamchallenge.io Project 1444"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "teamchallenge"}]

[tool.poetry.dependencies]
python = "^3.11,<4"
django = "^5.2.6"
djangorestframework = "^3.15.2"
django-jsoneditor = "^0.2.4"
drf-spectacular = {extras = ["sidecar"], version = "^0.28.0"}
django-filter = "^25.1"
django-redis = "^6.0.0"
python-dotenv = "^1.0.1"
drf-nested-routers = "^0.95.0"
pillow = "^11.1.0"
djangorestframework-simplejwt = "^5.4.0"
qrcode = "^8.0"
django-environ = "^0.12.0"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
django-ninja = "^1.3.0"
phonenumbers = "^9.0.15"
django-ipware = "^7.0.1"
django-crontab = "^0.7.1"
celery = "^5.4.0"
redis = {extras = ["hiredis"], version = "^6.4.0"}
django-celery-beat = "^2.7.0"
ipython = "^8.32.0"
djoser = "^2.3.1"
django-cors-headers = "^4.7.0"
django-extensions = "^4.1"
django-parler = "^2.3"
cloudinary = "^1.42.2"
psycopg = {extras = ["binary"], version = "^3.2.6"}
django-cloudinary-storage = "^0.3.0"
django-storages = {extras = ["s3"], version = "^1.14.5"}
pyotp = "^2.9.0"
liqpay = "^1.0.1"
django-liqpay = "^1.1"
django-ratelimit = "^4.1.0"
django-recaptcha = "^4.1.0"
django-versatileimagefield = "^3.1"
django-sendgrid-v5 = "^1.2.4"
django-celery-email = "^3.0.0"
django-debug-toolbar = "^6.0.0"
social-auth-app-django = "^5.4.3"
drf-spectacular-sidecar = "^2025.9.1"
certifi = "^2025.8.3"
django-anymail = {extras = ["brevo"], version = "^13.1"}


[tool.poetry.group.deploy.dependencies]
gunicorn = "^23.0.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
black = "^25.1.0"
ruff = "^0.12.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
# Use double quotes to match Black
quote-style = "double"
# Use spaces for indentation (Black's default)
indent-style = "space"
# Ensure Ruff respects Black's skip-string-normalization behavior
skip-magic-trailing-comma = false
# Match Black's line ending behavior (usually not needed, as both default to LF)
line-ending = "lf"

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120

