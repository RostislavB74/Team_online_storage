  /api/v1/cart/:
    get:
      operationId: api_v1_cart_list
      description: Отримання списку корзин + загальної суми
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        carts:
                          type: array
                          items:
                            $ref: '#/components/schemas/Cart'
                        total_sum_carts:
                          type: number
                          format: float
                        total_quantity:
                          type: integer
          description: Список елементів кошика, загальна сума і кількість
    post:
      operationId: api_v1_cart_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/{id}/:
