openapi: 3.0.3
info:
  title: Jewelry Store API
  version: 1.0.0
  description: API for jewelry store with products, categories, and more
paths:
  /api/:
    get:
      operationId: api_retrieve
      tags:
      - api
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchema'
          description: ''
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - uk
      tags:
      - api
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/all-products/:
    get:
      operationId: api_v1_all_products_list
      parameters:
      - in: query
        name: categories
        schema:
          type: array
          items:
            type: string
        description: Кілька значень можуть бути розділені комами.
        explode: false
        style: form
      - in: query
        name: category_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: collection
        schema:
          type: string
      - in: query
        name: collection_id
        schema:
          type: integer
          nullable: true
      # - in: query
      #   name: color
      #   schema:
      #     type: string
      - in: query
        name: color_name
        schema:
          type: string
      - in: query
        name: design
        schema:
          type: string
      - in: query
        name: gemstone
        schema:
          type: string
      - in: query
        name: is_ukrainian_cashback
        schema:
          type: boolean
    
      - in: query
        name: material_name
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: occasions
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: price_min
        schema:
          type: number
      - in: query
        name: statuses
        schema:
          type: string
      - in: query
        name: subcategories
        schema:
          type: array
          items:
            type: string
        description: Кілька значень можуть бути розділені комами.
        explode: false
        style: form
      - in: query
        name: subcategory_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: subproducts
        schema:
          type: string
      - in: query
        name: year_collection
        schema:
          type: string
      - in: query
        name: year_collection_range_max
        schema:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
      - in: query
        name: year_collection_range_min
        schema:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
      tags:
      - api
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTotalProductsList'
          description: ''
  /api/v1/all-products/{id}/:
    get:
      operationId: api_v1_all_products_retrieve
      description: Отримання продукту за ID разом із його підпродуктами
