components:
  schemas:
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - items
      - total_price
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        product_price:
          type: number
          format: double
          nullable: true
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_price:
          type: string
          readOnly: true
      required:
      - id
      - product
      - product_name
      - product_price
      - total_price
    Categories:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
      required:
      - id
      - name
      - slug
    DeliveryMethodEnum:
      enum:
      - pickup
      - courier
      - nova_poshta
      type: string
      description: |-
        * `pickup` - Самовивіз
        * `courier` - Кур'єр
        * `nova_poshta` - Нова Пошта
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        delivery_method:
          $ref: '#/components/schemas/DeliveryMethodEnum'
        recipient_name:
          type: string
        recipient_phone:
          type: string
        coupon:
          type: string
          nullable: true
          maxLength: 50
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        call_me:
          type: boolean
      required:
      - discount
      - id
      - items
    OrderItem:
      type: object
      properties:
        product:
          type: integer
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        product_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - product
      - product_price
      - total_price
    PatchedOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        delivery_method:
          $ref: '#/components/schemas/DeliveryMethodEnum'
        recipient_name:
          type: string
        recipient_phone:
          type: string
        coupon:
          type: string
          nullable: true
          maxLength: 50
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        call_me:
          type: boolean
    PaymentMethodEnum:
      enum:
      - cash
      - liqpay
      - googlepay
      type: string
      description: |-
        * `cash` - Готівка
        * `liqpay` - LiqPay
        * `googlepay` - Google Pay
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
        subcategory:
          type: integer
          nullable: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        ean_13:
          type: string
          nullable: true
          maxLength: 13
        sku:
          type: string
          nullable: true
          maxLength: 50
        article:
          type: string
          nullable: true
          maxLength: 50
        price:
          type: number
          format: double
          nullable: true
        collection:
          type: integer
          nullable: true
        occasions:
          type: array
          items:
            type: integer
        status_display:
          type: string
          readOnly: true
        circumference_mm:
          type: number
          format: double
          nullable: true
        size:
          type: string
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/ProductCertificate'
      required:
      - id
      - name
      - size
      - slug
      - status_display
    ProductCertificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - file
      - id
      - uploaded_at
    ProductImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - image
      - uploaded_at
    RingSize:
      type: object
      properties:
        finger_circumference:
          type: number
          format: double
          description: Обхват пальця в мм
        ring_size:
          type: number
          format: double
          description: Розмір кільця за стандартом
      required:
      - finger_circumference
      - ring_size
    StatusEnum:
      enum:
      - new
      - processing
      - paid
      - shipped
      type: string
      description: |-
        * `new` - Нове
        * `processing` - Обробка
        * `paid` - Оплачене
        * `shipped` - Відправлене
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
