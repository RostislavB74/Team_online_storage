  /api/v1/orders/{order_id}/update-status/:
    post:
      operationId: api_v1_orders_update_status_create
      description: Оновлення статусу замовлення з опціональним статусом оплати.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - awaiting_payment
                  - paid
                  - shipped
                  - delivered
                  - failed
                  - reversed
                  - cancelled
                payment_status:
                  type: string
                  enum:
                  - success
                  - failed
                  - reversed
                  nullable: true
              required:
              - status
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
