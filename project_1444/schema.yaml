      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - awaiting_payment
                  - paid
                  - shipped
                  - delivered
                  - failed
                  - reversed
                  - cancelled
                payment_status:
                  type: string
                  enum:
                  - success
                  - failed
                  - reversed
                  nullable: true
              required:
              - status
      security:
      - tokenAuth: []
      - cookieAuth: []
