  paths:
  /api/v1/ring-size/:
    get:
      summary: "Обчислення розміру кільця"
      parameters:
        - name: circumference
          in: query
          required: true
          schema:
            type: number
            example: 60
      responses:
        "200":
          description: "Розмір кільця"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ring_size:
                    type: string
                    example: "19.5"
