components:
  schemas:
    ApiSchema:
      type: object
      properties:
        endpoints:
          type: object
          additionalProperties:
            type: string
            format: uri
      required:
      - endpoints
    ApplyDiscountResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ApplyDiscountResponseStatusEnum'
        message:
          type: string
        discount:
          type: number
          format: double
      required:
      - message
      - status
    ApplyDiscountResponseStatusEnum:
      enum:
      - success
      - error
      type: string
      description: |-
        * `success` - success
        * `error` - error
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Ім'я користувача
        password:
          type: string
          writeOnly: true
          title: Пароль
        token:
          type: string
          readOnly: true
          title: Токен
      required:
      - password
      - token
      - username
    BlankEnum:
      enum:
      - ''
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        username:
          type: string
          readOnly: true
        product:
          type: integer
          title: Товар
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 32767
          minimum: 0
          title: Кількість
        total_price:
          type: string
          description: Обчислює загальну ціну для одного товару в корзині
          readOnly: true
        created_timestamp:
          type: string
          format: date-time
          readOnly: true
          title: Дата додавання
      required:
      - created_timestamp
      - id
      - product
      - product_name
      - total_price
      - username
    Categories:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        slug:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
        has_length:
          type: boolean
          title: Має довжину (см)
        has_width:
          type: boolean
          title: Має ширину (см)
        has_diameter:
          type: boolean
          title: Має діаметр (мм)
        has_weight:
          type: boolean
          title: Має вагу (г)
      required:
      - id
      - name
      - slug
      - updated_at
    CategoriesTree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        slug:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
        has_length:
          type: boolean
          title: Має довжину (см)
        has_width:
          type: boolean
          title: Має ширину (см)
        has_diameter:
          type: boolean
          title: Має діаметр (мм)
        has_weight:
          type: boolean
          title: Має вагу (г)
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/SubCategoryShort'
          readOnly: true
      required:
      - id
      - name
      - slug
      - subcategories
      - updated_at
    Descriptions:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        text:
          type: string
          readOnly: true
        seo_title:
          type: string
          readOnly: true
        seo_description:
          type: string
          readOnly: true
        keywords:
          type: string
          readOnly: true
      required:
      - id
      - keywords
      - name
      - seo_description
      - seo_title
      - slug
      - text
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          maxLength: 10
      required:
      - status
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    NullEnum:
      enum:
      - null
    OTP:
      type: object
      properties:
        otp_code:
          type: string
          maxLength: 6
          minLength: 6
        otp_user_id:
          type: integer
      required:
      - otp_code
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/OrderPaymentMethodEnum'
          default: cash
        delivery_method:
          allOf:
          - $ref: '#/components/schemas/OrderDeliveryMethodEnum'
          default: pickup
        recipient_name:
          type: string
          nullable: true
          maxLength: 100
        recipient_phone:
          type: string
          nullable: true
          maxLength: 20
        address:
          type: string
          nullable: true
        coupon:
          type: integer
