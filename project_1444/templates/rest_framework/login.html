<!-- templates/rest_framework/login.html -->
{% extends "rest_framework/base.html" %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 0 auto;">
    <!-- Existing form login -->
    <form action="{% url 'rest_framework:login' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input id="username" type="text" name="username" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input id="password" type="password" name="password" class="form-control">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Log in</button>
    </form>

    <!-- Google Auth Button -->
    <div style="margin: 20px 0; text-align: center;">
        <p>Or sign in with:</p>
        <a href="{% url 'social:begin' 'google-oauth2' %}?next={{ next }}" 
           class="btn" 
           style="background: #DB4437; color: white; width: 100%;">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo"
                     style="width: 20px; height: 20px; margin-right: 10px;">
            <i class="fa fa-google"></i> Sign in with Google
        </a>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger" style="margin-top: 20px;">
            Invalid username or password.
        </div>
    {% endif %}
</div>
{% endblock %}
