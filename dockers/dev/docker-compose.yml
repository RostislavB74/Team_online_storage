# docker compose up --build -d && docker compose logs -f backend

name: project_1444_dev

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      ../../.env-dev
    ports:
      - "5432:5432"
#    expose:
#      - "5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5
      timeout: 3s

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
#    expose:
#      - "5432"

  backend:
    build:
      context: ../..
      dockerfile: dockers/Dockerfile

    restart: always
    depends_on:
      - redis
      - db
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - data_volume:/app/data
    environment:
      DEPLOY_MODE: DEV
    env_file:
      ../../.env-dev
    ports:
      - "8000:8000"

